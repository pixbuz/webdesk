<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="style.css">
		<title>Webdesk!</title>
		<script async src="script.js"></script>
	</head>
	<body>
		<svg xmlns="http://www.w3.org/2000/svg" class="Background">
			<filter id="cool">
				<feTurbulence baseFrequency='0.01' result='noise' filterRes="1000"/>
				<feDiffuseLighting in='noise' lighting-color='var(--nord0)' surfaceScale='6'>
					<feDistantLight azimuth='45' elevation='60' />
				</feDiffuseLighting>
			</filter>
			<rect width="100%" height="100%" filter="url(#cool)" />
		</svg>
		<section class="Launcher Space"></section>
		<section class="Window Space"></section>
		<section class="Error Space"></section>
		<section class="StatusBar"></section>

		<section class="Assets">
<div name="Launcher" onclick="openWindow(this)">
	<img class="Icon"/>
	<h6 class="Name"></h6>
</div>
<div name="Window">
	<div class="Titlebar">
		<img class="Icon"/>
		<div class="Buttons">
			<button class="Minimize" onclick="minimizeWindow(this)"></button>
			<button class="Maximise" onclick="maximiseWindow(this)"></button>
			<button class="Close" onclick="closeWindow(this)"></button>
		</div>
	</div>
	<div class="ContentWrapper">
		<iframe src="" width="100%" height="100%" frameborder="0"></iframe>
	</div>
</div>
<div name="StatusIcon" onclick="focus(this)">
	<img class="Icon"/>
</div>
</section>
	</body>
</html>
