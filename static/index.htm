<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="style.css">
		<title>Webdesk!</title>
		<script async src="script.js"></script>
	</head>
	<body>
		<div class="Background">
			<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
				<filter id="cool">
					<feTurbulence baseFrequency='0.01' numOctaves="1" result='noise' filterRes="1000"/>
					<feDiffuseLighting in='noise' lighting-color='var(--nord4)' surfaceScale='6'>
						<feDistantLight azimuth='45' elevation='60' />
					</feDiffuseLighting>
				</filter>
				<rect width="100%" height="100%" filter="url(#cool)" />
			</svg>
		</div>
		<section class="Launcher Space"></section>
		<section class="Window Space"></section>
		<section class="Error Space"></section>
		<section class="AppDock">
			<div class="Open"></div>
			<div class="Clock">
				<div class="Time">
					<p class="Hours"></p>
					<p class="Spacer">:</p>
					<p class="Minutes"></p>
					<p class="Spacer">:</p>
					<p class="Seconds"></p>
				</div>
				<div class="Date">
					<p class="Day"></p>
					<p class="Spacer">/</p>
					<p class="Month"></p>
					<p class="Spacer">/</p>
					<p class="Year"></p>
				</div>
			</div>
		</section>

		<section class="Assets"><!--Assets--></section>
	</body>
</html>
