<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Webdesk!</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="/style">
		<link rel="manifest" href="/manifest">
	</head>
	<body>
		<div class="Background" aria-hidden="true"></div>
		<section class="Launcher Space" aria-label="App Launcher"></section>
		<main class="Window Space" aria-label="Desktop Workspace"></main>
		<section class="Error Space" aria-live="polite" aria-label="Notifications"></section>
		<nav class="AppDock" aria-label="Taskbar">
			<div class="Open"></div>
			<div class="Clock">
				<div class="Time">
					<p class="hours"></p>
					<p class="Spacer">:</p>
					<p class="minutes"></p>
					<p class="Spacer">:</p>
					<p class="seconds"></p>
				</div>
				<div class="Date">
					<p class="day"></p>
					<p class="Spacer">/</p>
					<p class="month"></p>
					<p class="Spacer">/</p>
					<p class="year"></p>
				</div>
			</div>
		</nav>
		<script async src="/script"></script>
	</body>
</html>
