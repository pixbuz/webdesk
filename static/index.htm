<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Webdesk!</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="A modern desktop environment built for the browser. Window management, customizable themes, custom backgrounds and an overall OS-like experience on the web.">
		<link rel="manifest" href="/manifest">
		<link rel="preload" href="/api/getManifests" as="fetch" crossorigin="anonymous">
		<link rel="modulepreload" href="/core">
		<style>
			* {
				margin: 0;
				padding: 0;
				position: relative;
				box-sizing: border-box;
				font-family: Inter, Roboto, system-ui, -apple-system;
			}

			html {
				background: #000;
				position: static;
				overflow: hidden;
				height: 100svh;
				width: 100svw;
				z-index: 0;
			}

			body {
				background: #000;
				position: relative;
				overflow: hidden;
				height: 100svh;
				width: 100svw;
				z-index: 0;
				justify-content: center;
				display: flex;
			}

			.Space {
				width: 100%;
				height: 100%;
				pointer-events: none;
				position: absolute;
				inset: 0;
			}

			.Space > * { pointer-events: all; }
			.Space.Background { z-index: 00; }
			.Space.Launcher { z-index: 10; }
			.Space.Window { z-index: 20; }
			.Space.Error { z-index: 40; }
		</style>
	</head>
	<body class="">
		<div class="Background" aria-hidden="true"></div>
		<div offline>
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="lucide-wifi">
				<path d="M12 20h.01"/>
				<path d="M8.5 16.429a5 5 0 0 1 7 0"/>
				<path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
				<path d="M19 12.859a10 10 0 0 0-2.007-1.523"/>
				<path d="M2 8.82a15 15 0 0 1 4.177-2.643"/>
				<path d="M22 8.82a15 15 0 0 0-11.288-3.764"/>
				<path d="m2 2 20 20"/>
			</svg>
			<p>Offline</p>
			<p>-</p>
			<p id="offline">Can't connect to server</p>
		</div>
		<section class="Launcher Space" aria-label="App Launcher">
		</section>
		<main class="Window Space" aria-label="Desktop Workspace"></main>
		<!-- <section class="Notification Space" aria-live="polite" aria-label="Notifications"></section> -->
		<nav dock aria-label="Taskbar">
			<div class="Open"></div>
			<div class="Clock">
				<div class="Time">
					<p class="hours"></p>
					<p class="Spacer">:</p>
					<p class="minutes"></p>
					<p class="Spacer">:</p>
					<p class="seconds"></p>
				</div>
				<div class="Date">
					<p class="day"></p>
					<p class="Spacer">/</p>
					<p class="month"></p>
					<p class="Spacer">/</p>
					<p class="year"></p>
				</div>
			</div>
		</nav>
		<script async src="/launchers" type="module"></script>
		<script async src="/dock" type="module"></script>
		<script async src="/wm" type="module"></script>
	</body>
</html>
