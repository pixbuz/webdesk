<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="style">
		<title>Webdesk!</title>
		<script async src="script"></script>
	</head>
	<body>
		<div class="Background"></div>
		<section class="Launcher Space"></section>
		<section class="Window Space"></section>
		<section class="Error Space"></section>
		<section class="AppDock">
			<div class="Open"></div>
			<div class="Clock">
				<div class="Time">
					<p class="hours"></p>
					<p class="Spacer">:</p>
					<p class="minutes"></p>
					<p class="Spacer">:</p>
					<p class="seconds"></p>
				</div>
				<div class="Date">
					<p class="day"></p>
					<p class="Spacer">/</p>
					<p class="month"></p>
					<p class="Spacer">/</p>
					<p class="year"></p>
				</div>
			</div>
		</section>
	</body>
</html>
