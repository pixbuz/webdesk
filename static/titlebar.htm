<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				user-select: none;
				box-sizing: border-box;
				font-family: system-ui, -apple-system;
			}
			body {
				justify-content: space-between;
				flex-flow: row nowrap;
				padding: 0 1% 4px 1%;
				overflow: hidden;
				display: flex;
				width: 100%;
			}
			.iconWrapper {
				
				flex: 1;
			}
			.icon {
				height: 21px;
				width: 21px;
			}
			.title {
				text-transform: capitalize;
				text-align: center;
				margin: auto;
				flex: 1;
			}
			.buttons {
				justify-content: flex-end;
				flex-flow: row nowrap;
				pointer-events: none;
				align-items: center;
				display: flex;
				gap: 4px;
				flex: 1;
			}
			button {
				pointer-events: all;
				aspect-ratio: 1.25;
				border-radius: 4px;
				aspect-ratio: 1.25;
				height: 75svh;
				border: none;
			}
			button.minimise { background: var(--windows-color-buttons-mini); }
			button.maximise { background: var(--windows-color-buttons-maxi); }
			button.close { background: var(--windows-color-buttons-close); }
		</style>
	</head>
	<body>
		<div class="iconWrapper">
			<img class="icon"/>
		</div>
		<p class="title"></p>
		<div class="buttons">
			<button class="minimise"></button>
			<button class="maximise"></button>
			<button class="close"></button>
		</div>
	</body>
</html>
