<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				user-select: none;
				box-sizing: border-box;
				font-family: system-ui, -apple-system;
			}
			body {
				justify-content: space-between;
				flex-flow: row nowrap;
				overflow: hidden;
				padding: 0 8px;
				display: flex;
				width: 100%;
			}
			.iconWrapper {
				justify-content: start;
				align-items: center;
				display: flex;
				flex: 1;
			}
			.icon {
				height: 21px;
				width: 21px;
			}
			.title {
				color: var(--windows-color-titlebar-title);
				text-transform: capitalize;
				text-align: center;
				margin: auto;
				flex: 1;
			}
			body.focus .title { color: var(--windows-color-titlebar-focus-title); }
			.buttons {
				justify-content: flex-end;
				flex-flow: row nowrap;
				pointer-events: none;
				align-items: center;
				display: flex;
				gap: 4px;
				flex: 1;
			}
			button {
				pointer-events: all;
				aspect-ratio: 1.25;
				border-radius: 4px;
				border: none;
				height: 85%;
			}
			[minimise] { background: var(--windows-color-titlebar-buttons-mini); }
			[maximise] { background: var(--windows-color-titlebar-buttons-maxi); }
			[close] { background: var(--windows-color-titlebar-buttons-close); }

			body.focus [minimise] { background: var(--windows-color-titlebar-focus-buttons-mini); }
			body.focus [maximise] { background: var(--windows-color-titlebar-focus-buttons-maxi); }
			body.focus [close] { background: var(--windows-color-titlebar-focus-buttons-close); }
		</style>
	</head>
	<body>
		<div class="iconWrapper">
			<img class="icon"/>
		</div>
		<p class="title"></p>
		<div class="buttons">
			<button minimise onclick="port.postMessage({ command: `minimise` })"></button>
			<button maximise onclick="port.postMessage({ command: `maximise` })"></button>
			<button close onclick="port.postMessage({ command: `close` })"></button>
		</div>
	</body>
	<script>
let port

window.addEventListener("message", com, { once: true })

function com({ data: message, ports }) {
	if (!port) {
		port = ports[0]
		port.start()
		port.addEventListener("message", (event) => com(event) )
		init(message.payload)
	}

	console.log(message)
	switch(message.command) {
		case "css": return updateVar(message.data)
		case "focus": return updateFocus(message.data)
	}
}

function updateFocus(inFocus) {
	if (inFocus) { document.body.classList.add("focus") }
	else { document.body.classList.remove("focus") }
}

function updateVar(details) {
	document.documentElement.style.setProperty(details.css, details.value)
}

function init({ app, palette}) {
	document.querySelector(".title").innerText = app
	document.documentElement.setAttribute("style", palette)

	document.querySelector(".icon").src = `http://${app}.localhost/icon`

	// IDEA: using right mouse click moves but doesn't update the window focus
	document.body.addEventListener("pointermove", (event) => port.postMessage({ command: "move", data: { x: event.screenX, y: event.screenY } }))
	document.body.addEventListener("pointerdown", sendPointerEvent)
	document.body.addEventListener("pointerup", sendPointerEvent)
}

function sendPointerEvent(event) {
	const data = { x: event.screenX, y: event.screenY }
	if (event.target.tagName === "BUTTON") return
	else if (event.type === "pointerup") {
		document.body.releasePointerCapture(event.pointerId)
		port.postMessage({ command: "move-end", data })
	} else {
		document.body.setPointerCapture(event.pointerId)
		port.postMessage({ command: "move-start", data })
	}
}
	</script>
</html>
