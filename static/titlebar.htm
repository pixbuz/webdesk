<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				user-select: none;
				box-sizing: border-box;
				font-family: system-ui, -apple-system;
			}
			body {
				justify-content: space-between;
				flex-flow: row nowrap;
				padding: 0 1% 4px 1%;
				overflow: hidden;
				display: flex;
				width: 100%;
			}
			.iconWrapper {
				justify-content: start;
				align-items: center;
				display: flex;
				flex: 1;
			}
			.icon {
				height: 21px;
				width: 21px;
			}
			.title {
				text-transform: capitalize;
				text-align: center;
				margin: auto;
				flex: 1;
			}
			.buttons {
				justify-content: flex-end;
				flex-flow: row nowrap;
				pointer-events: none;
				align-items: center;
				display: flex;
				gap: 4px;
				flex: 1;
			}
			button {
				pointer-events: all;
				aspect-ratio: 1.25;
				border-radius: 4px;
				aspect-ratio: 1.25;
				height: 75svh;
				border: none;
			}
			[minimise] { background: var(--windows-color-buttons-mini); }
			[maximise] { background: var(--windows-color-buttons-maxi); }
			[close] { background: var(--windows-color-buttons-close); }
		</style>
	</head>
	<body>
		<div class="iconWrapper">
			<img class="icon"/>
		</div>
		<p class="title"></p>
		<div class="buttons">
			<button minimise onclick="port.postMessage({ command: `minimise` })"></button>
			<button maximise onclick="port.postMessage({ command: `maximise` })"></button>
			<button close onclick="port.postMessage({ command: `close` })"></button>
		</div>
	</body>
	<script>
		let port

		function commandListener(messageEvent) {
			const message = messageEvent.data

			switch(message.command) {
				case "init":
					init(messageEvent.ports[0])
					break
				case "title":
					document.querySelector(".title").innerText = message.result
					break
				case "icon":
					document.querySelector(".icon").src = message.result
					break
				case "css":
					document.documentElement.setAttribute("style", message.result.join("; "))
					break
			}
		}

		function init(comPort) {
			port = comPort

			port.onmessage = commandListener

			port.postMessage({ command: "title" })
			port.postMessage({ command: "icon" })
			port.postMessage({ command: "style" })

			// IDEA: using right mouse click moves but doesn't update the window focus
			document.body.addEventListener("pointerdown", (event) => {
				// If the element clicked is a button, ignore the event
				if (event.target.tagName === "BUTTON") { return }

				document.body.setPointerCapture(event.pointerId)

				port.postMessage({ command: "move-start", result: { x: event.screenX, y: event.screenY } })
			})

			// Send an event when the user moves
			document.body.addEventListener("pointermove", (event) => {
				port.postMessage({ command: "move", result: { x: event.screenX, y: event.screenY } })
			})

			// Send an event when releases the click in the titlebar
			document.body.addEventListener("pointerup", (event) => {
				// If the element clicked is a button, ignore the event
				if (event.target.tagName === "BUTTON") { return }

				document.body.releasePointerCapture(event.pointerId)

				port.postMessage({ command: "move-end", result: { x: event.screenX, y: event.screenY } })
			})
		}

		window.addEventListener("message", commandListener)
	</script>
</html>
