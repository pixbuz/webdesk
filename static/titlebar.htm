<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Application</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				user-select: none;
				box-sizing: border-box;
				font-family: system-ui, -apple-system;
			}
			html,body {
				justify-content: space-between;
				flex-flow: row nowrap;
				overflow: hidden;
				padding: 0 8px;
				display: flex;
				width: 100%;
				height: 100%;
			}
			.iconWrapper {
				justify-content: start;
				align-items: center;
				display: flex;
				flex: 1;
			}
			.icon {
				height: 21px;
				width: 21px;
			}
			.title {
				color: var(--content);
				text-transform: capitalize;
				text-align: center;
				margin: auto;
				flex: 1;
			}
			.buttons {
				justify-content: flex-end;
				flex-flow: row nowrap;
				pointer-events: none;
				align-items: center;
				display: flex;
				gap: 4px;
				flex: 1;
				padding: 4px;
			}
			button {
				pointer-events: all;
				aspect-ratio: 1.25;
				border-radius: 4px;
				border: none;
				height: 85%;
			}
			[minimise] { background: var(--success); }
			[maximise] { background: var(--accent); }
			[close] { background: var(--error); }
		</style>
	</head>
	<body>
		<div class="iconWrapper">
			<img class="icon"/>
		</div>
		<p class="title"></p>
		<div class="buttons">
			<button minimise onclick="window.parent.postMessage({ command: `minimise` })"></button>
			<button maximise onclick="window.parent.postMessage({ command: `maximise` })"></button>
			<button close onclick="window.parent.postMessage({ command: `close` })"></button>
		</div>
	</body>
	<script>
window.addEventListener("message", com, { once: true })

function com({ data: message }) {
	switch(message.command) {
		case "css": return updatePalette(message.data)
		case "focus": return updateFocus(message.data)
		case "init": return init(message.data)
	}
}

function updateFocus(inFocus) {
	if (inFocus) { document.body.classList.add("focus") }
	else { document.body.classList.remove("focus") }
}

function updatePalette(palette) {
	const paletteRules = [ ]
	for (const [ color, value ] of Object.entries(palette)) { paletteRules.push(`--${color}: ${value};`) }
	document.body.setAttribute("style", `${paletteRules.join("")}`)
}

function init({ app, palette, origin }) {
	document.querySelector(".title").innerText = app
	document.querySelector(".icon").src = `${window.location.protocol}//${app}.${window.location.hostname}/icon`

	updatePalette(palette)

	// IDEA: using right mouse click moves but doesn't update the window focus
	document.body.addEventListener("pointermove", (event) => window.parent.postMessage({ command: "move", data: { x: event.screenX, y: event.screenY } }))
	document.body.addEventListener("pointerdown", sendPointerEvent)
	document.body.addEventListener("pointerup", sendPointerEvent)
}

function sendPointerEvent(event) {
	const data = { x: event.screenX, y: event.screenY }
	let command
	if (event.target.tagName === "BUTTON") return
	else if (event.type === "pointerup") {
		document.body.releasePointerCapture(event.pointerId)
		command = "move-end"
	} else {
		document.body.setPointerCapture(event.pointerId)
		command = "move-start"
	}
	window.parent.postMessage({ command, data })
}
	</script>
</html>
