<svg xmlns="http://www.w3.org/2000/svg">
	<filter id="speckleEffect">
		<feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="4" seed="4" result="turbulence" />
		<feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3840" xChannelSelector="R" yChannelSelector="B" />
	</filter>
	
	<radialGradient id="vignette" r="100%">
		<stop stop-color="oklch(51.716% .155 267)" offset="50%"/>
		<stop stop-color="oklch(47.636% .180 267)" offset="100%"/>
	</radialGradient>
	
	<rect width="100%" height="100%" fill="url(#vignette)" />
	<rect width="100%" height="100%" fill="oklch(51.716% .155 267)" filter="url(#speckleEffect)" />
</svg>
